        1: `<h2>📌 Capítulo 1: Conceptos de base de datos de SQL Azure</h2>
            <p>Este capítulo introduce Microsoft SQL Azure como un servicio de base de datos relacional en la nube basado en SQL Server. Se destacan:</p>
            <ul>
                <li><strong>Portal de administración:</strong> nuevo portal con herramienta web para diseñar tablas, vistas, procedimientos y ejecutar consultas.</li>
                <li><strong>Similitudes y diferencias:</strong> SQL Azure usa TDS y Transact-SQL, pero la administración física es automática (Microsoft gestiona hardware, replicación, conmutación por error). El DBA administra lógica (esquemas, seguridad, índices).</li>
                <li><strong>Arquitectura:</strong> niveles: cliente (aplicaciones locales o en Windows Azure), servicios (aprovisionamiento, facturación, enrutamiento), plataforma (servidores físicos con SQL Server y tejido de SQL Azure) e infraestructura (hardware).</li>
                <li><strong>Modelo de aprovisionamiento:</strong> cuenta Windows Azure → suscripción → servidores SQL Azure (hasta 6 por suscripción, 150 bases de datos por servidor). Cada servidor tiene una base de datos <em>master</em> de solo lectura y inicios de sesión.</li>
                <li><strong>Facturación:</strong> dos ediciones: Web (1 o 5 GB) y Business (10-50 GB). Se cobra mensualmente según el tamaño máximo alcanzado diariamente. El ancho de banda dentro de la misma región es gratuito.</li>
                <li><strong>MAXSIZE:</strong> limita el crecimiento; si se alcanza, se rechazan inserciones hasta liberar espacio o aumentar el límite.</li>
            </ul>
            <p>En resumen, SQL Azure ofrece una base de datos administrada, escalable y familiar para desarrolladores de SQL Server, con diferencias clave en administración física y disponibilidad.</p>`,

        2: `<h2>📌 Capítulo 2: Administrar bases de datos e inicios de sesión en SQL Azure</h2>
            <p>Se enfoca en la administración de seguridad y migración de bases de datos.</p>
            <ul>
                <li><strong>Seguridad:</strong> la autenticación es solo SQL (no Windows). Los roles <code>loginmanager</code> y <code>dbmanager</code> en la base de datos <em>master</em> controlan la creación de inicios de sesión y bases de datos.</li>
                <li><strong>Inicios de sesión:</strong> se crean con <code>CREATE LOGIN</code> en <em>master</em>. Para dar acceso a una base de datos, se crea un usuario con <code>CREATE USER</code>.</li>
                <li><strong>Permisos:</strong> se pueden asignar roles de servidor (loginmanager, dbmanager) y roles de base de datos (db_owner, etc.).</li>
                <li><strong>Migración:</strong> se puede migrar una base de datos existente generando scripts con el Asistente para generar scripts (configurando opciones para SQL Azure) y ejecutándolos en la nube. También se mencionan otras herramientas: Sync Framework 2.1, Asistente de migración de SQL Azure.</li>
                <li><strong>Ejemplo:</strong> se incluye el script completo de la base de datos <em>School</em> (tablas, relaciones, procedimientos y datos) para practicar la migración.</li>
                <li><strong>Mover datos:</strong> se puede usar SQL Server Integration Services (SSIS) o la utilidad <code>bcp</code>.</li>
            </ul>
            <p>La administración se realiza principalmente a través de la base de datos <em>master</em>, y la migración requiere adaptar el script a las características admitidas.</p>`,

        3: `<h2>📌 Capítulo 3: Copiar bases de datos y supervisar SQL Azure</h2>
            <p>Este capítulo cubre la copia de bases de datos como mecanismo de respaldo y la supervisión mediante vistas de administración dinámica (DMV).</p>
            <ul>
                <li><strong>Copia de bases de datos:</strong> se usa <code>CREATE DATABASE ... AS COPY OF</code> para crear una copia (misma edición y tamaño). Puede ser en el mismo servidor o entre servidores (misma región).</li>
                <li><strong>Proceso asíncrono:</strong> la copia se realiza en segundo plano; se supervisa con <code>sys.dm_database_copies</code> y <code>sys.databases</code> (estado <em>COPYING</em> o <em>ONLINE</em>).</li>
                <li><strong>Permisos:</strong> el inicio de sesión debe ser el propietario (DBO) de la base de datos origen y tener el rol <code>dbmanager</code> en el servidor destino. Además, debe tener el mismo nombre y contraseña en ambos servidores.</li>
                <li><strong>Supervisión con DMV:</strong> se pueden calcular tamaños (<code>sys.dm_db_partition_stats</code>), ver conexiones (<code>sys.dm_exec_sessions</code>, <code>sys.dm_exec_connections</code>), rendimiento de consultas (<code>sys.dm_exec_query_stats</code>), consultas bloqueadas (<code>sys.dm_tran_locks</code>) y planes de consulta.</li>
                <li><strong>Firewall:</strong> se configura mediante el portal o con procedimientos <code>sp_set_firewall_rule</code> y <code>sp_delete_firewall_rule</code> en <em>master</em>. Permite accesos desde Internet (rangos IP) y desde Windows Azure (IP 0.0.0.0).</li>
                <li><strong>Solución de problemas:</strong> errores de inicio de sesión, servicio no disponible, desconexiones por inactividad (30 min) o uso excesivo de recursos.</li>
            </ul>
            <p>La copia de bases de datos es una herramienta clave para respaldos y pruebas, mientras que las DMV permiten una monitorización detallada del rendimiento.</p>`,

        4: `<h2>📌 Capítulo 4: Desarrollo</h2>
            <p>Describe el desarrollo de aplicaciones para SQL Azure, las herramientas compatibles y las limitaciones de Transact-SQL.</p>
            <ul>
                <li><strong>Creación de servidores y bases de datos:</strong> mediante el portal o comandos <code>CREATE DATABASE</code> (con <em>edition</em> y <em>MAXSIZE</em>).</li>
                <li><strong>Compatibilidad de Transact-SQL:</strong> se admiten la mayoría de las instrucciones DML y DDL, pero no todas. No se admiten: CLR, Service Broker, Replication, copias de seguridad/restauración, tablas temporales globales, etc.</li>
                <li><strong>Herramientas compatibles:</strong> SQL Server Management Studio (2008 R2 o superior), <code>sqlcmd</code>, Asistente para generar scripts, DAC (aplicaciones de capa de datos), SSIS, <code>bcp</code>, SMO (parcial), SSMA, Access, PowerPivot.</li>
                <li><strong>Controladores y bibliotecas:</strong> ADO.NET, Entity Framework, ODBC (Native Client), PHP, JDBC.</li>

                <li><strong>Seguridad:</strong> firewall, cifrado y validación de certificados (<code>Encrypt=True; TrustServerCertificate=False</code>), autenticación solo SQL.</li>
            </ul>
            <p>El desarrollo en SQL Azure es similar a SQL Server, pero con restricciones específicas que deben tenerse en cuenta, especialmente en Transact-SQL y en la administración de índices.</p>`,

        5: `<h2>📌 Capítulo 5: Conectar con SQL Azure</h2>
            <p>Se explican las distintas formas de conectarse a SQL Azure desde diversas plataformas y lenguajes.</p>

        6: `<h2>📌 Capítulo 6: TRANSACT-SQL en SQL Azure. Tipos de datos, funciones y operadores</h2>
            <p>Este capítulo detalla los tipos de datos, funciones y operadores compatibles en SQL Azure.</p>
            <ul>
                <li><strong>Tipos de datos:</strong> se admiten numéricos exactos (int, decimal, money...), aproximados (float, real), fecha/hora (date, datetime2...), cadenas (char, varchar, nchar, nvarchar...), binarios (binary, varbinary), espaciales (geography, geometry) y otros (cursor, hierarchyid, xml, timestamp, uniqueidentifier).</li>
                <li><strong>Métodos para tipos espaciales:</strong> se listan métodos OGC y extendidos para <code>geography</code> y <code>geometry</code> (STArea, STDistance, STBuffer, etc.).</li>

                <li><strong>Tipo xml:</strong> se admiten métodos <code>query()</code>, <code>value()</code>, <code>exist()</code>, <code>modify()</code>, <code>nodes()</code> y las operaciones DML XML (<code>insert</code>, <code>delete</code>, <code>replace value of</code>).</li>
                <li><strong>Funciones:</strong> se cubren funciones de agregado (AVG, COUNT, SUM...), de categoría (RANK, NTILE...), escalares (configuración, fecha/hora, matemáticas, metadatos, seguridad, cadenas, sistema) y escalares de ODBC.</li>
                <li><strong>Operadores:</strong> aritméticos (+, -, *, /, %), compuestos (+=, -=, ...), bit a bit (&, |, ^), lógicos (AND, OR, NOT, BETWEEN, LIKE...), de comparación (=, >, <, >=, <=, <>), unarios (+, -, ~) y misceláneos (concatenación, asignación).</li>
                <li><strong>Tablas y vistas del sistema:</strong> SQL Azure no admite tablas del sistema; en su lugar, ofrece vistas como <code>sys.bandwidth_usage</code>, <code>sys.dm_database_copies</code>, <code>sys.firewall_rules</code>, y vistas de catálogo, compatibilidad y DMV parciales.</li>
            </ul>
            <p>La compatibilidad es amplia, pero se deben consultar las listas específicas para asegurar que el código Transact-SQL funciona correctamente en la nube.</p>`,

        7: `<h2>📌 Capítulo 7: TRANSACT-SQL en SQL Azure. Instrucciones SQL Server admitidas y procedimientos</h2>
            <p>Se listan las instrucciones Transact-SQL admitidas, las no admitidas, y los procedimientos almacenados del sistema disponibles.</p>
            <ul>
                <li><strong>Instrucciones admitidas:</strong> ALTER ROLE, CREATE TABLE, DELETE, INSERT, SELECT, UPDATE, etc. Se incluyen las sugerencias de consulta (excepto MAXDOP y PAGLOCK).</li>
                <li><strong>Instrucciones SET:</strong> se admiten las relacionadas con fecha/hora, bloqueo, ejecución, ISO, estadísticas y transacciones (SET DATEFIRST, SET LOCK_TIMEOUT, SET NOCOUNT, SET TRANSACTION ISOLATION LEVEL, etc.).</li>
                <li><strong>Instrucciones no admitidas:</strong> BACKUP, RESTORE, CREATE/ALTER/DROP para objetos no soportados (ensamblados, claves asimétricas, certificados, extremos, etc.), consultas distribuidas, transacciones distribuidas, Service Broker, etc.</li>

                </li>
                <li><strong>Errores y excepciones:</strong> se proporcionan tablas con códigos de error comunes (4001, 40501, 40544, etc.), errores de copia de base de datos, pérdida de conexión y limitación (throttling) con descodificación de códigos de motivo.</li>

        8: `<h2>📌 Capítulo 8: TRANSACT-SQL en SQL Azure. Lenguaje de definición de datos DDL</h2>
            <p>Profundiza en las instrucciones DDL (ALTER, CREATE, DROP) y sus variantes en SQL Azure.</p>
            <ul>
                <li><strong>Instrucciones ALTER:</strong>
                    <ul>
                        <li><code>ALTER AUTHORIZATION</code>: cambia el propietario de un objeto (solo para OBJECT, TYPE, ROLE, SCHEMA).</li>
                        <li><code>ALTER DATABASE</code>: modifica nombre, edición (Web/Business) y MAXSIZE (1,5,10,20,30,40,50 GB). No admite COLLATE, opciones de archivo, etc.</li>
                        <li><code>ALTER FUNCTION</code>: modifica funciones escalares y con valores de tabla (no CLR).</li>
                        <li><code>ALTER INDEX</code>: permite REBUILD, DISABLE, SET opciones (IGNORE_DUP_KEY, STATISTICS_NORECOMPUTE, ONLINE). No admite particiones, compresión, etc.</li>
                        <li><code>ALTER LOGIN</code>: cambia contraseña, nombre o habilita/deshabilita el inicio de sesión.</li>
                        <li><code>ALTER PROCEDURE</code>: modifica procedimientos (sin ENCRYPTION ni FOR REPLICATION).</li>
                        <li><code>ALTER TABLE</code>: agrega/quita columnas, restricciones, habilita/deshabilita triggers. No admite columnas SPARSE, FILESTREAM, particiones.</li>
                        <li><code>ALTER TRIGGER</code>: modifica triggers DML y DDL (no triggers de inicio de sesión).</li>
                        <li><code>ALTER USER</code>: cambia nombre, esquema predeterminado o LOGIN asociado.</li>
                        <li><code>ALTER VIEW</code>: modifica vistas (sin ENCRYPTION).</li>
                    </ul>
                </li>
                <li><strong>Instrucciones CREATE:</strong>
                    <ul>
                        <li><code>CREATE DATABASE</code>: con EDITION y MAXSIZE, y opción AS COPY OF para copiar bases de datos.</li>
                        <li><code>CREATE FUNCTION</code>: similar a ALTER FUNCTION.</li>
                        <li><code>CREATE INDEX</code>: índices clúster y no clúster, incluye filtrados y opciones básicas.</li>
                        <li><code>CREATE LOGIN</code>: solo con PASSWORD.</li>
                        <li><code>CREATE PROCEDURE</code>: sin ENCRYPTION ni FOR REPLICATION.</li>
                        <li><code>CREATE SPATIAL INDEX</code>: índices espaciales con teselación GEOMETRY_GRID o GEOGRAPHY_GRID.</li>
                        <li><code>CREATE SYNONYM</code>, <code>CREATE TABLE</code> (requiere índice clúster), <code>CREATE TRIGGER</code>, <code>CREATE TYPE</code>, <code>CREATE USER</code> (con LOGIN o WITHOUT LOGIN), <code>CREATE VIEW</code>.</li>
                    </ul>
                </li>
                <li><strong>Instrucciones DROP:</strong> <code>DROP DATABASE</code>, <code>DROP INDEX</code>, <code>DROP TABLE</code>, <code>DROP TRIGGER</code> (con sus limitaciones).</li>
            </ul>
            <p>El capítulo detalla minuciosamente cada comando DDL, indicando qué parámetros son válidos y cuáles no, lo que es crucial para la administración de esquemas en SQL Azure.</p>`,

        9: `<h2>📌 Capítulo 9: TRANSACT-SQL en SQL Azure. Lenguajes de manipulación y control de datos DML y DCL</h2>
            <p>Se centra en las instrucciones DML (INSERT, UPDATE, DELETE) y DCL (GRANT, REVOKE, DENY), así como otras instrucciones de control.</p>
            <ul>
                <li><strong>INSERT:</strong> se admite con las mismas sintaxis que en SQL Server, pero no permite nombres de tres o cuatro partes ni OPENQUERY/OPENROWSET. También se incluye la cláusula OUTPUT.</li>
                <li><strong>DCL (GRANT, REVOKE, DENY):</strong> se pueden conceder/revocar/denegar permisos a nivel de base de datos, sobre entidades de seguridad (usuarios, roles) y sobre tipos. No se admiten permisos para roles de aplicación, usuarios mapeados a certificados o claves asimétricas, ni usuarios de Windows.</li>
                <li><strong>EXECUTE y EXECUTE AS:</strong> se pueden ejecutar procedimientos y funciones, con la opción <code>AS USER</code> pero no <code>AS LOGIN</code>. La cláusula <code>EXECUTE AS</code> en módulos admite CALLER, SELF, OWNER o 'user_name'.</li>
                <li><strong>ENABLE/DISABLE TRIGGER:</strong> permiten habilitar o deshabilitar triggers (DML o DDL). No se admite <code>ALL SERVER</code>.</li>
                <li><strong>USE:</strong> en SQL Azure, la instrucción USE solo permite la base de datos actual; no cambia de base de datos. Para cambiar se debe establecer una nueva conexión.</li>
                <li><strong>Lenguaje TCL:</strong> BEGIN TRANSACTION, COMMIT, ROLLBACK, SAVE TRANSACTION son totalmente compatibles.</li>
            </ul>
            <p>Las instrucciones DML y DCL son muy similares a las de SQL Server, con restricciones menores, y constituyen la base para la manipulación de datos y la gestión de permisos en la nube.</p>`

    // ===== GENERAR TABS Y CONTENIDO =====
    const tabContainer = document.getElementById('tabContainer');
    const contentContainer = document.getElementById('contentContainer');

    let tabsHtml = '';
    let contentHtml = '';

    chapters.forEach((ch, idx) => {
        const active = idx === 0 ? 'active' : '';
        const num = ch.id;
        tabsHtml += `<button class="tab-btn ${active}" data-chapter="${num}">${ch.label}</button>`;

        contentHtml += `<div class="chapter-content ${active}" id="chapter${num}">
            <div class="summary">${summaries[num]}</div>
            <div class="quiz">
                <h3>📝 Cuestionario · ${ch.label}</h3>
                ${renderQuiz(num)}
            </div>
        </div>`;
    });

    tabContainer.innerHTML = tabsHtml;
    contentContainer.innerHTML = contentHtml;

    // ===== FUNCIÓN PARA RENDERIZAR PREGUNTAS =====
    function renderQuiz(chapterId) {
        const questions = quizzes[chapterId];
        if (!questions) return '<p>Cuestionario no disponible.</p>';
        let html = '';
        questions.forEach((q, index) => {
            html += `<div class="question" data-q="${index}">
                <p>${index+1}. ${q.q}</p>
                <div class="options">
                    ${q.o.map((opt, oi) => `
                        <label>
                            <input type="radio" name="q${chapterId}_${index}" value="${oi}">
                            ${opt}
                        </label>
                    `).join('')}
                </div>
                <div class="correct-answer">✅ Respuesta correcta: ${q.o[q.a]}</div>
            </div>`;
        });
        return html;
    }

    // ===== LÓGICA DE PESTAÑAS =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const chapter = this.dataset.chapter;
            // Desactivar todos
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.chapter-content').forEach(c => c.classList.remove('active'));
            // Activar
            this.classList.add('active');
            document.getElementById('chapter' + chapter).classList.add('active');
        });
    });

    // ===== MOSTRAR RESPUESTAS =====
    // Añadir botón a cada capítulo
    document.querySelectorAll('.chapter-content').forEach((ch, idx) => {
        const btn = document.createElement('button');
        btn.className = 'show-answers-btn';
        btn.textContent = '🔍 Mostrar respuestas';
        btn.addEventListener('click', function() {
            const container = this.closest('.chapter-content');
            const corrects = container.querySelectorAll('.correct-answer');
            corrects.forEach(el => {
                el.style.display = 'block';
            });
        });
        ch.appendChild(btn);
    });
